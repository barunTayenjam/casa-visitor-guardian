ffmpeg:
  h264_main: "-codec:v libx264 -g:v 30 -preset:v superfast -tune:v zerolatency -profile:v main"

streams:
  cam1:
    - ${CAM1_RTSP_URL}
  cam1_sub:
    - ffmpeg:${CAM1_SUB_RTSP_URL}#video=h264_main
  cam2:
    - ${CAM2_RTSP_URL}
  cam2_sub:
    - ${CAM2_SUB_RTSP_URL}

api:
  listen: ":1984"
  origin: "*"

webrtc:
  listen: ":8555"
  candidates:
    - ${GO2RTC_ADVERTISED_HOST}:8555
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

log:
  level: "info"
  format: "text"
